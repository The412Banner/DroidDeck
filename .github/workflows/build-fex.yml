name: Build FEX (x86-64 Steam client experiment)

# FEX built for the runtime in an Arch Linux ARM container on an arm64 runner (tools/fex), for the
# opt-in x86-64 Steam client (droiddeck-steam-x64). Published as a release asset that script
# fetches; the runtime image and the default arm64 client are untouched.
on:
  push:
    paths:
      - 'tools/fex/**'
      - '.github/workflows/build-fex.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish as (e.g. fex-2609-r1); empty = artifact only'
        required: false
        default: ''
      thunks:
        description: 'Build the host thunks (Vulkan/GL/X11/... to the runtime arm64 libraries)'
        required: false
        default: 'false'
      cxxflags:
        description: 'Extra CXXFLAGS for a diagnostic build (e.g. -DDEBUG_STRACE); never published with a tag'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build in Arch Linux ARM
        # Inputs reach the shell as environment variables, never pasted into the script.
        env:
          FEX_EXTRA_CXXFLAGS: ${{ inputs.cxxflags }}
          FEX_THUNKS: ${{ inputs.thunks == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          docker run --rm -e FEX_EXTRA_CXXFLAGS="$FEX_EXTRA_CXXFLAGS" -e FEX_THUNKS="$FEX_THUNKS" -v "$PWD:/work" -w /work menci/archlinuxarm:base-devel bash tools/fex/build-in-arch.sh
          sudo chown -R "$(id -u):$(id -g)" .
      - uses: actions/upload-artifact@v4
        with:
          name: fex
          path: |
            fex.tzst
            fex.tzst.sha256
            fex-needed.txt
            fex-files.txt

  # Only this job can write: the build above runs third-party images and toolchains with a read-only token.
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.cxxflags == '' && inputs.thunks == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fex
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # droiddeck-steam-x64 pins each tag's sha256 and the archive is not reproducible: a tag is never
          # rebuilt over. Publish a new tag instead.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; publish under a new tag"
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --latest=false --prerelease=false --title "$TAG" --notes "FEX for the runtime (tools/fex/build-in-arch.sh); fetched by droiddeck-steam-x64. sha256 $(cut -d' ' -f1 fex.tzst.sha256)" fex.tzst fex.tzst.sha256
          # A component the apk fetches by tag, never something users install: it must not
          # become the repo's Latest release or appear as a pre-release.
          gh release edit "$TAG" --latest=false --prerelease=false
